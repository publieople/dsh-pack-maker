name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build & pack tarball
        run: npm pack

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            dsh-pack-maker-*.tgz \
            --title "dsh-pack-maker v${{ steps.version.outputs.version }}" \
            --notes "DeepSeek Harness 整合包插件。安装：\`dsh plugin --profile web add https://github.com/publieople/dsh-pack-maker/releases/download/v${{ steps.version.outputs.version }}/dsh-pack-maker-${{ steps.version.outputs.version }}.tgz\`"

      - name: Publish to npm (if NPM_TOKEN configured)
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
